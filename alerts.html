<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Alert</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .page-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .page-header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            color: #166534;
            margin-bottom: 5px;
        }

        .alert-card {
            background: #fff7ed;
            border-left: 5px solid #f97316;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .alert-card h3 {
            color: #c2410c;
            margin-bottom: 8px;
        }

        .alert-card p {
            color: #555;
            line-height: 1.5;
        }

        .safe-card {
            background: #f0fdf4;
            border-left: 5px solid #16a34a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .safe-card h3 {
            color: #166534;
        }

        .back-btn {
            margin-top: 20px;
            width: auto;
            padding: 10px 20px;
        }
    </style>

</head>

<body>

    <div class="page-container">

        <section class="page-header">

            <h1>Attendance Alert</h1>

            <p>
                Check subjects that need attention.
            </p>

        </section>


        <div class="alert-card">

            <h3>⚠️ Operating Systems</h3>
