<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance History</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .page-container {
            max-width: 950px;
            margin: auto;
            padding: 20px;
        }

        .page-header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            color: #166534;
            margin-bottom: 5px;
        }

        .history-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f0fdf4;
            color: #166534;
        }

        .present {
            color: #16a34a;
            font-weight: bold;
        }

        .absent {
            color: #dc2626;
            font-weight: bold;
        }

        .back-btn {
            margin-top: 20px;
            width: auto;
            padding: 10px 20px;
        }
    </style>

</head>

<body>

    <div class="page-container">

        <section class="page-header">

            <h1>Attendance History</h1>

            <p>
                View your daily attendance records.
            </p>

        </section>


        <section class="history-box">

            <h2>Recent Attendance</h2>

            <br>

            <table>

                <tr>
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>20 Sep 2026</td>
                    <td>Python</td>
                    <td class="present">Present</td>
                </tr>

                <tr>
                    <td>19 Sep 2026</td>
                    <td>DBMS</td>
                    <td class="present">Present</td>
                </tr>

                <tr>
                    <td>18 Sep 2026</td>
                    <td>Operating Systems</td>
                    <td class="absent">Absent</td>
                </tr>

                <tr>
                    <td>17 Sep 2026</td>
                    <td>Computer Networks</td>
                    <td class="present">Present</td>
                </tr>

                <tr>
                    <td>16 Sep 2026</td>
                    <td>Python</td>
                    <td class="present">Present</td>
                </tr>

            </table>

        </section>


        <button
            class="back-btn"
            onclick="window.location.href='dashboard.html'">

            ← Back to Dashboard

        </button>

    </div>

</body>

</html>
